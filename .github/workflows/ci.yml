name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --coverage

      - name: Build (Raycast CLI — the same gate the Store runs)
        run: npx ray build -e dist

      - name: Architecture boundary (SDK must not import Raycast/React)
        run: |
          if grep -rnE "from \"(@raycast/(api|utils)|react|react-dom)\"" src/sdk; then
            echo "::error::src/sdk must not import Raycast or React packages."
            exit 1
          fi
          echo "SDK boundary OK."

      - name: Security audit (runtime deps only)
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
