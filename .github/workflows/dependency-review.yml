# Requires a public repository (or GitHub Advanced Security on a private one).
name: Dependency review

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
